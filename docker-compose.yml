services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sisjog-sql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}"
    volumes:
      - sisjog-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}"
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C
          -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - sisjog-net

  seq:
    image: datalust/seq:latest
    container_name: sisjog-seq
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    volumes:
      - sisjog-seq-data:/data
    restart: unless-stopped
    networks:
      - sisjog-net

  sisjog-api:
    build:
      context: .
      dockerfile: Sisjog.Api/Dockerfile
    container_name: sisjog-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SisjogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      Seq__ServerUrl: "http://seq"
    depends_on:
      sqlserver:
        condition: service_healthy
      seq:
        condition: service_started
    restart: unless-stopped
    networks:
      - sisjog-net

  rabbitmq:
    image: rabbitmq:4-management
    container_name: sisjog-rabbitmq
    profiles:
      - messaging
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-}"
    volumes:
      - sisjog-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - sisjog-net

networks:
  sisjog-net:

volumes:
  sisjog-sql-data:
  sisjog-seq-data:
  sisjog-rabbitmq-data:
