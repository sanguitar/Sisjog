services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sisjog-sql
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}"
    volumes:
      - sisjog-sql-data:/var/opt/mssql
    restart: unless-stopped
    networks:
      - sisjog-net

  sisjog-api:
    build:
      context: .
      dockerfile: Sisjog.Api/Dockerfile
    container_name: sisjog-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SisjogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      - sqlserver
    networks:
      - sisjog-net

networks:
  sisjog-net:

volumes:
  sisjog-sql-data:
